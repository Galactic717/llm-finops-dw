[project]
name = "llm-finops-dw"
version = "0.1.0"
description = "LLM pricing, inference telemetry and routing experiment warehouse"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.24,<0.30",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "sqlfluff>=3.4,<4", "dbt-postgres>=1.9,<2"]
analysis = ["scipy>=1.14,<2", "scikit-learn>=1.6,<2", "nbconvert>=7.16,<8", "ipykernel>=6.29,<8", "matplotlib>=3.9,<4", "openpyxl>=3.1,<4"]
delta = ["pyspark==4.0.1", "delta-spark==4.0.0", "pyarrow>=15,<25"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"databricks/*.ipynb" = ["F821"]
"notebooks/*.ipynb" = ["E402"]
