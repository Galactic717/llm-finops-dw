name: Warehouse checks

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: warehouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, SQL, and PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finops
          POSTGRES_PASSWORD: finops
          POSTGRES_DB: finops
        ports:
          - 55436:5432
        options: >-
          --health-cmd "pg_isready -U finops -d finops"
          --health-interval 3s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install locked dependencies
        run: uv sync --locked --group analysis
      - name: Lint Python and SQL
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync sqlfluff lint sql dbt_project/models dbt_project/tests
      - name: Generate and load deterministic fixtures
        run: |
          uv run --locked --no-sync python -m ingestion.ingest_verstak_logs demo --end 2026-11-24 --per-day 30
          uv run --locked --no-sync python -m ingestion.warehouse ingest
      - name: Build and test dbt models
        run: uv run --locked --no-sync dbt build --project-dir dbt_project --profiles-dir dbt_project
      - name: Run Python and PostgreSQL integration tests
        run: uv run --locked --no-sync pytest -q
        env:
          FINOPS_TEST_POSTGRES: "1"
          OMP_NUM_THREADS: "2"
