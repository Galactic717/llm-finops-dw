name: llm-finops-dw

x-airflow: &airflow
  image: llm-finops-airflow:local
  build:
    context: .
    dockerfile: airflow/Dockerfile
  working_dir: /opt/finops
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/finops/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: finops-compose-local
    FINOPS_DB_HOST: warehouse
    FINOPS_DB_PORT: "5432"
    FINOPS_DB_PASSWORD: ${FINOPS_DB_PASSWORD:-finops}
    FINOPS_METABASE_PASSWORD: ${FINOPS_METABASE_PASSWORD:-finops_read}
    PYTHONPATH: /opt/finops
  volumes:
    - .:/opt/finops
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: ${FINOPS_DB_PASSWORD:-finops}
      POSTGRES_DB: finops
    ports: ["127.0.0.1:55436:5432"]
    volumes: ["warehouse_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finops"]
      interval: 3s
      timeout: 3s
      retries: 25

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: ["airflow_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 3s
      timeout: 3s
      retries: 25

  airflow-init:
    <<: *airflow
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json,sys; sys.exit(not any(u["username"] == "admin" for u in json.load(sys.stdin)))'; then
          airflow users create --role Admin --username admin --firstname FinOps --lastname Local --email admin@example.test --password admin
        fi

  airflow-web:
    <<: *airflow
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8086:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.56.9.2
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: -Xmx768m
    ports: ["127.0.0.1:3006:3000"]
    volumes: ["metabase_data:/metabase-data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 25

volumes:
  warehouse_db:
  airflow_db:
  airflow_logs:
  metabase_data:
